<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="vsBlueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005FB8" />
      <stop offset="100%" stop-color="#00B7FF" />
    </linearGradient>
    <linearGradient id="vsBlueGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#007ACC" />
    </linearGradient>
    <filter id="logo-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="250" cy="250" r="235" stroke="rgba(0, 183, 255, 0.1)" stroke-width="4" stroke-dasharray="10 15" fill="none" />
  <circle cx="250" cy="250" r="215" stroke="rgba(0, 183, 255, 0.05)" stroke-width="2" fill="none" />

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#logo-glow-filter)">
    <path d="M 120,80 L 120,420" stroke="url(#vsBlueGrad1)" stroke-width="45" />
    <path d="M 320,100 L 400,180 L 400,320 L 320,400" stroke="url(#vsBlueGrad2)" stroke-width="35" />
    <path d="M 130,250 L 340,90" stroke="url(#vsBlueGrad2)" stroke-width="40" />
    <path d="M 130,250 L 340,410" stroke="url(#vsBlueGrad1)" stroke-width="40" />
    <path 
      d="M 150,250 C 150,190 240,190 280,250 C 320,310 410,310 410,250 C 410,190 320,190 280,250 C 240,310 150,310 150,250 Z" 
      stroke="url(#vsBlueGrad2)" 
      stroke-width="30" 
    />
  </g>

  <circle
    cx="250"
    cy="250"
    r="14"
    fill="#FFFFFF"
    style="filter: drop-shadow(0px 0px 10px rgba(0, 210, 255, 0.9));"
  />
</svg>