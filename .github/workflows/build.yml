name: Build and Release Kyvora Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          repository: priyanshuvishwakarma273403/Kyvora-Studio-Releases
          tag_name: ${{ github.ref_name }}
          name: Kyvora Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Kyvora Studio ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 (Installer) | `Kyvora-Studio-Setup-x64.exe` |
            | Windows x64 (Portable) | `Kyvora-Studio-win32-x64.zip` |
            | macOS x64 (Installer DMG) | `Kyvora-Studio-darwin-x64.dmg` |
            | macOS x64 (Portable ZIP) | `Kyvora-Studio-darwin-x64.zip` |
            | Linux x64 (Debian DEB) | `Kyvora-Studio-linux-x64.deb` |
            | Linux x64 (RedHat RPM) | `Kyvora-Studio-linux-x64.rpm` |
            | Linux x64 (Portable tarball) | `Kyvora-Studio-linux-x64.tar.gz` |

            ### Installation
            - **Windows**: Run `Kyvora-Studio-Setup-x64.exe` and follow wizard
            - **macOS**: Mount `Kyvora-Studio-darwin-x64.dmg` and drag to Applications
            - **Linux (Debian/Ubuntu)**: Install via `sudo apt install ./Kyvora-Studio-linux-x64.deb`
            - **Linux (Fedora/RHEL)**: Install via `sudo dnf install ./Kyvora-Studio-linux-x64.rpm`
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-windows:
    name: Windows x64
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: "true"
      GYP_MSVS_VERSION: "2022"
      GYP_MSVS_DIR: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
      vs2022_install: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          npm run gulp vscode-win32-x64-min
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup

      - name: Package
        shell: pwsh
        run: |
          Copy-Item ".build\win32-x64\user-setup\VSCodeSetup.exe" -Destination "Kyvora-Studio-Setup-x64.exe" -Force
          $src = Join-Path (Split-Path $pwd) "VSCode-win32-x64"
          Compress-Archive -Path "$src\*" -DestinationPath "Kyvora-Studio-win32-x64.zip" -Force

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          repository: priyanshuvishwakarma273403/Kyvora-Studio-Releases
          files: |
            Kyvora-Studio-Setup-x64.exe
            Kyvora-Studio-win32-x64.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-linux:
    name: Linux x64
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          npm run gulp vscode-linux-x64-min
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          npm run gulp vscode-linux-x64-prepare-rpm
          npm run gulp vscode-linux-x64-build-rpm

      - name: Package
        run: |
          cp .build/linux/deb/amd64/deb/*.deb Kyvora-Studio-linux-x64.deb
          cp .build/linux/rpm/x86_64/*.rpm Kyvora-Studio-linux-x64.rpm
          src="../VSCode-linux-x64"
          tar -czf Kyvora-Studio-linux-x64.tar.gz -C "$(dirname "$src")" "$(basename "$src")"

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          repository: priyanshuvishwakarma273403/Kyvora-Studio-Releases
          files: |
            Kyvora-Studio-linux-x64.deb
            Kyvora-Studio-linux-x64.rpm
            Kyvora-Studio-linux-x64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  build-macos:
    name: macOS x64
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          npm run gulp vscode-darwin-x64-min

      - name: Package
        run: |
          export VSCODE_ARCH=x64
          export VSCODE_QUALITY=stable
          node --experimental-strip-types build/darwin/create-dmg.ts .. .
          mv VSCode-darwin-x64.dmg Kyvora-Studio-darwin-x64.dmg
          cd ../VSCode-darwin-x64
          zip -r -y "$GITHUB_WORKSPACE/Kyvora-Studio-darwin-x64.zip" .

      - name: Upload
        uses: softprops/action-gh-release@v3
        with:
          repository: priyanshuvishwakarma273403/Kyvora-Studio-Releases
          files: |
            Kyvora-Studio-darwin-x64.dmg
            Kyvora-Studio-darwin-x64.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
