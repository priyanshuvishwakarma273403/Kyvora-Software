name: Build and Release Kyvora Studio

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kyvora Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Installer
    needs: release
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GYP_MSVS_VERSION: 2022

      - name: Build Production Binaries
        run: |
          npm run gulp vscode-win32-x64-min

      - name: Prepare Inno Setup Updater
        run: |
          npm run gulp vscode-win32-x64-inno-updater

      - name: Build Installer
        run: |
          npm run gulp vscode-win32-x64-user-setup

      - name: Rename Installer
        shell: pwsh
        run: |
          Copy-Item ".build/win32-x64/user-setup/VSCodeSetup.exe" "KyvoraSetup.exe"

      - name: Upload Windows Setup to Release
        uses: softprops/action-gh-release@v2
        with:
          files: KyvoraSetup.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux DEB Package
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Install dependencies
        run: |
          npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Binaries
        run: |
          npm run gulp vscode-linux-x64-min

      - name: Prepare DEB Package
        run: |
          npm run gulp vscode-linux-x64-prepare-deb

      - name: Build DEB Package
        run: |
          npm run gulp vscode-linux-x64-build-deb

      - name: Rename DEB Package
        run: |
          cp .build/linux/deb/amd64/deb/*.deb kyvora.deb

      - name: Upload Linux DEB to Release
        uses: softprops/action-gh-release@v2
        with:
          files: kyvora.deb
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS DMG
    needs: release
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Production Binaries
        run: |
          npm run gulp vscode-darwin-x64-min

      - name: Build DMG Package
        run: |
          mkdir -p ../out
          export VSCODE_ARCH=x64
          export VSCODE_QUALITY=stable
          npx tsx build/darwin/create-dmg.ts ../VSCode-darwin-x64 ../out

      - name: Rename DMG Package
        run: |
          cp ../out/*.dmg Kyvora.dmg

      - name: Upload macOS DMG to Release
        uses: softprops/action-gh-release@v2
        with:
          files: Kyvora.dmg
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
