name: Build and Release Kyvora Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: "--max-old-space-size=8192"

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Kyvora Studio ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Kyvora Studio ${{ github.ref_name }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows x64 | `Kyvora-Studio-win32-x64.zip` |
            | Linux x64 | `Kyvora-Studio-linux-x64.tar.gz` |
            | macOS x64 | `Kyvora-Studio-darwin-x64.zip` |

            ### Installation
            - **Windows**: Extract ZIP → run `Kyvora Studio.exe`
            - **Linux**: Extract tar.gz → run `./kyvora-studio`
            - **macOS**: Extract ZIP → drag `Kyvora Studio.app` to Applications
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Windows x64
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: "true"
      GYP_MSVS_VERSION: "2022"
      GYP_MSVS_DIR: "C:/Program Files/Microsoft Visual Studio/2022/Enterprise"
      vs2022_install: "C:\\Program Files\\Microsoft Visual Studio\\2022\\Enterprise"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run gulp vscode-win32-x64-min

      - name: Package
        shell: pwsh
        run: |
          $src = Join-Path (Split-Path $pwd) "VSCode-win32-x64"
          Compress-Archive -Path "$src\*" -DestinationPath "Kyvora-Studio-win32-x64.zip" -Force

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: Kyvora-Studio-win32-x64.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux x64
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ pkg-config \
            libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev \
            fakeroot rpm

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run gulp vscode-linux-x64-min

      - name: Package
        run: |
          src="../VSCode-linux-x64"
          tar -czf Kyvora-Studio-linux-x64.tar.gz -C "$(dirname "$src")" "$(basename "$src")"

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: Kyvora-Studio-linux-x64.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS x64
    needs: create-release
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure Git
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf ssh://git@github.com/

      - name: Install Dependencies
        run: npm install --no-audit --no-fund
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run gulp vscode-darwin-x64-min

      - name: Package
        run: |
          cd ../VSCode-darwin-x64
          zip -r -y "$GITHUB_WORKSPACE/Kyvora-Studio-darwin-x64.zip" .

      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: Kyvora-Studio-darwin-x64.zip
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
