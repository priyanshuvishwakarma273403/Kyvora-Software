server:
  port: 8080

spring:
  application:
    name: kyvora-backend

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3309/kyvora_collaboration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USER:kyvora_admin}
    password: ${DATABASE_PASS:kyvora_secure_pass_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 6000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: kyvora-collaboration-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Custom Security Settings
kyvora:
  security:
    jwt:
      secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1hbmQtc3Ryb25nLWp3dC1zZWNyZXQta2V5LWZvci1reXZvcmEtc3R1ZGlvLTIwMjYtZW50ZXJwcmlzZS1xdWFsaXR5}
      expiration-ms: 86400000 # 24 hours
      refresh-expiration-ms: 604800000 # 7 days
  ai:
    gemini:
      api-key: ${GEMINI_API_KEY:}
    openrouter:
      api-key: ${OPENROUTER_API_KEY:}
    groq:
      api-key: ${GROQ_API_KEY:}
    huggingface:
      api-key: ${HUGGINGFACE_API_KEY:}
    sambanova:
      api-key: ${SAMBANOVA_API_KEY:}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.web: INFO
    com.kyvora.backend: DEBUG
