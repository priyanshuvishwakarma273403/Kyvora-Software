version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kyvora-mysql
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: kyvora_collaboration
      MYSQL_USER: kyvora_admin
      MYSQL_PASSWORD: kyvora_secure_pass_2026
      MYSQL_ROOT_PASSWORD: kyvora_root_secret_2026
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "kyvora_admin", "-pkyvora_secure_pass_2026"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: kyvora-valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: kyvora-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTERS_UUID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kyvora-backend:
    build:
      context: ./kyvora-backend
      dockerfile: Dockerfile
    container_name: kyvora-backend-app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-jdbc:mysql://mysql:3306/kyvora_collaboration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DATABASE_USER: ${DATABASE_USER:-kyvora_admin}
      DATABASE_PASS: ${DATABASE_PASS:-kyvora_secure_pass_2026}
      REDIS_HOST: ${REDIS_HOST:-valkey}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_SASL_MECHANISM: ${KAFKA_SASL_MECHANISM:-}
      KAFKA_JAAS_CONFIG: ${KAFKA_JAAS_CONFIG:-}
      KAFKA_SSL_ENGINE_FACTORY_CLASS: ${KAFKA_SSL_ENGINE_FACTORY_CLASS:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-pv254424@gmail.com}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      RECIPIENT_EMAIL: ${RECIPIENT_EMAIL:-pv254424@gmail.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY}
      SAMBANOVA_API_KEY: ${SAMBANOVA_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
      kafka:
        condition: service_started

volumes:
  mysql-data:
  valkey-data:
  kafka-data:
